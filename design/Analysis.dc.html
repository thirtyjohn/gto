<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #2aa9c9; } a:hover { color: #1f8ba8; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-family: ui-monospace, Menlo, monospace; font-size: 8px; font-weight: 600;
      letter-spacing: -.03em; border-radius: 1px; color: #c3d2e0; overflow: hidden; }
    .slot { width: 44px; height: 60px; border-radius: 6px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-weight: 700; line-height: 1; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0a1626; color: #e9eff6; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex: none; height: 56px; background: #0d1d33; border-bottom: 1px solid #1f3a58; display: grid; grid-template-columns: 56px 1fr 56px; align-items: center">
    <div style="display: flex; align-items: center; justify-content: center; color: #8ba3bd; font-size: 20px">✕</div>
    <div style="text-align: center; font-size: 17px; font-weight: 600">分析模式</div>
    <div style="display: flex; align-items: center; justify-content: center; color: #2aa9c9; font-size: 15px">随机</div>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 20px">

    <!-- 摆牌区 -->
    <div style="background: #13293f; border: 1px solid #1f3a58; border-radius: 12px; padding: 13px 14px; margin-bottom: 14px">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px">
        <div class="mono" style="font-size: 11px; letter-spacing: .12em; color: #2aa9c9">公共牌</div>
        <div class="mono" style="font-size: 11.5px; color: #8ba3bd">KQ 高干燥 · 彩虹</div>
      </div>
      <div style="display: flex; gap: 6px; margin-bottom: 14px">
        <div class="slot" style="background: #fff; color: #c22f26"><div style="font-size: 21px">K</div><div style="font-size: 16px; margin-top: 2px">♦</div></div>
        <div class="slot" style="background: #fff; color: #c22f26"><div style="font-size: 21px">7</div><div style="font-size: 16px; margin-top: 2px">♥</div></div>
        <div class="slot" style="background: #fff; color: #16202b"><div style="font-size: 21px">2</div><div style="font-size: 16px; margin-top: 2px">♣</div></div>
        <div class="slot" style="background: #0d2137; border: 1px dashed #2d4a68; color: #5d7793; font-size: 20px; font-weight: 400">+</div>
      </div>

      <div class="mono" style="font-size: 11px; letter-spacing: .12em; color: #2aa9c9; margin-bottom: 10px">你的底牌</div>
      <div style="display: flex; gap: 6px">
        <div class="slot" style="background: #fff; color: #16202b"><div style="font-size: 21px">9</div><div style="font-size: 16px; margin-top: 2px">♠</div></div>
        <div class="slot" style="background: #fff; color: #16202b"><div style="font-size: 21px">8</div><div style="font-size: 16px; margin-top: 2px">♠</div></div>
      </div>
    </div>

    <!-- 结果条 -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px">
      <div style="background: #13293f; border: 1px solid #1f3a58; border-radius: 10px; padding: 10px 8px; text-align: center">
        <div class="mono" style="font-size: 21px; font-weight: 700">15%</div>
        <div style="font-size: 11.5px; color: #8ba3bd; margin-top: 2px">现在领先</div>
      </div>
      <div style="background: #13293f; border: 1px solid #1f3a58; border-radius: 10px; padding: 10px 8px; text-align: center">
        <div class="mono" style="font-size: 21px; font-weight: 700">31%</div>
        <div style="font-size: 11.5px; color: #8ba3bd; margin-top: 2px">算到河牌</div>
      </div>
      <div style="background: #13293f; border: 1px solid #1f3a58; border-radius: 10px; padding: 10px 8px; text-align: center">
        <div class="mono" style="font-size: 21px; font-weight: 700; color: #d9911f">7%</div>
        <div style="font-size: 11.5px; color: #8ba3bd; margin-top: 2px">范围分位</div>
      </div>
    </div>

    <!-- 建议 -->
    <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px">
      <div style="display: flex; align-items: center; gap: 10px"><span style="width: 76px; font-size: 13.5px">下注 1.8BB</span><span style="flex: 1; height: 18px; background: #13293f; border-radius: 4px; position: relative"><span style="position: absolute; inset: 0 28% 0 0; background: #d9911f; border-radius: 4px"></span></span><span class="mono" style="width: 40px; text-align: right; font-size: 14px; font-weight: 700">72%</span></div>
      <div style="display: flex; align-items: center; gap: 10px"><span style="width: 76px; font-size: 13.5px">下注 4.1BB</span><span style="flex: 1; height: 18px; background: #13293f; border-radius: 4px; position: relative"><span style="position: absolute; inset: 0 88% 0 0; background: #c0442b; border-radius: 4px"></span></span><span class="mono" style="width: 40px; text-align: right; font-size: 14px; color: #8ba3bd">12%</span></div>
      <div style="display: flex; align-items: center; gap: 10px"><span style="width: 76px; font-size: 13.5px">过牌</span><span style="flex: 1; height: 18px; background: #13293f; border-radius: 4px; position: relative"><span style="position: absolute; inset: 0 84% 0 0; background: #1f9d63; border-radius: 4px"></span></span><span class="mono" style="width: 40px; text-align: right; font-size: 14px; color: #8ba3bd">16%</span></div>
    </div>

    <!-- 对手范围编辑器 -->
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 9px">
      <div class="mono" style="font-size: 11px; letter-spacing: .12em; color: #2aa9c9">对手范围　点格子增减</div>
      <div class="mono" style="font-size: 11.5px; color: #8ba3bd">36.3% · 481 组合</div>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 10px">
      <div style="padding: 6px 12px; border-radius: 999px; background: #1f8ba8; border: 1px solid #1f8ba8; color: #fff; font-size: 13px; font-weight: 600">GTO</div>
      <div style="padding: 6px 12px; border-radius: 999px; background: #13293f; border: 1px solid #1f3a58; color: #8ba3bd; font-size: 13px">紧</div>
      <div style="padding: 6px 12px; border-radius: 999px; background: #13293f; border: 1px solid #1f3a58; color: #8ba3bd; font-size: 13px">松</div>
      <div style="padding: 6px 12px; border-radius: 999px; background: #13293f; border: 1px solid #1f3a58; color: #8ba3bd; font-size: 13px">站街鱼</div>
    </div>

    <div style="background: #13293f; border: 1px solid #1f3a58; border-radius: 10px; padding: 7px">
      <div style="display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="169">
          <div class="cell" style="background: {{c.bg}}">{{c.k}}</div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; margin-top: 10px; font-size: 12px; color: #8ba3bd">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 11px; height: 11px; border-radius: 2px; background: #2fa877"></span>跟注</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 11px; height: 11px; border-radius: 2px; background: #1c6a4c"></span>部分频率</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 11px; height: 11px; border-radius: 2px; background: #33475c"></span>弃牌</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const R = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
    const cells = [];
    for (let i = 0; i < 13; i++) {
      for (let j = 0; j < 13; j++) {
        const k = i === j ? R[i] + R[j] : i < j ? R[i] + R[j] + 's' : R[j] + R[i] + 'o';
        const d = Math.max(i, j) + Math.abs(i - j) * (i < j ? 0.7 : 1.5);
        let bg = '#33475c';
        if (d < 9) bg = '#2fa877';
        else if (d < 11) bg = '#1c6a4c';
        cells.push({ k: k.replace(/[so]$/, ''), bg });
      }
    }
    return { cells };
  }
}
</script>
</body>
</html>
