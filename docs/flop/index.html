<title>翻牌圈训练器</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1626">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #0a1626; --bg2: #0d1d33; --card: #13293f; --card2: #1a3552; --line: #1f3a58;
    --text: #e9eff6; --muted: #8ba3bd; --dim: #5d7793;
    --accent: #1f8ba8; --accent2: #2aa9c9;
    --felt-a: #2f9b63; --felt-b: #14663c;
    --raise: #e8703a; --call: #2fa877; --fold: #5c7086;
    --btn-fold: #c0442b; --btn-call: #1f9d63; --btn-raise: #d9911f;
    --good: #3ecf8e; --bad: #e5533d; --zone-check: #3c4f66;
    --f: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --f-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--f);
    font-size: 16px; line-height: 1.5; overflow: hidden;
    -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  #app { height: 100%; display: flex; flex-direction: column; }
  .topbar {
    flex: none; display: grid; grid-template-columns: 56px 1fr 56px; align-items: center;
    padding-top: env(safe-area-inset-top); height: calc(56px + env(safe-area-inset-top));
    background: var(--bg2); border-bottom: 1px solid var(--line);
  }
  .topbar h1 { margin: 0; font-size: 17px; font-weight: 600; text-align: center; letter-spacing: .02em; }
  .topbar button { height: 44px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .icon-btn { font-size: 20px; }
  .txt-btn { font-size: 15px; color: var(--accent2); }

  .screens { flex: 1; position: relative; min-height: 0; }
  .screen {
    position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: none; padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  .screen.on { display: block; }

  /* 首页 */
  .grp { padding: 22px 16px 4px; }
  .grp .gh { font-size: 21px; font-weight: 700; }
  .grp .gs { font-size: 12.5px; color: var(--muted); margin: 3px 0 12px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .poscard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; text-align: left; width: 100%; }
  .poscard:active { background: var(--card2); }
  .poscard.fresh { opacity: .62; }
  .poscard .pos { font-size: 24px; font-weight: 700; letter-spacing: .02em; }
  .poscard .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; min-height: 16px; }
  .poscard .tot { font-size: 13px; color: var(--muted); margin-top: 12px; font-family: var(--f-num); }
  .poscard .tally { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-family: var(--f-num); font-size: 15px; }
  .tally .ok { color: var(--good); } .tally .no { color: var(--bad); } .tally .sep { color: var(--dim); }
  .pbar { height: 3px; background: var(--card2); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: var(--good); }

  .redobar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
    background: linear-gradient(135deg, #1d3a4f, #16304a);
    border: 1px solid var(--accent); border-radius: 12px; padding: 14px 16px; text-align: left;
  }
  .redotitle { font-size: 17px; font-weight: 700; }
  .redosub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .redogo { flex: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; padding: 9px 14px; border-radius: 9px; }
  .crosslink {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 16px; text-decoration: none; color: inherit;
  }
  .crosslink:active { background: var(--card2); }

  /* 场景面 */
  .sheetwrap { padding: 16px 16px 0; }
  .facing { font-size: 13.5px; color: var(--muted); margin: 0 0 12px; }
  .tally-row { display: flex; align-items: center; gap: 10px; font-family: var(--f-num); font-size: 15px; margin: 0 0 16px; color: var(--muted); }
  .rangepair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .rghd { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .rghd b { font-size: 14px; }
  .rghd span { font-family: var(--f-num); font-size: 11.5px; color: var(--muted); }
  .rgft { font-family: var(--f-num); font-size: 11px; color: var(--dim); margin-top: 5px; }
  .presetnote { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }

  .lab { font-family: var(--f-num); font-size: 11px; letter-spacing: .12em; color: var(--accent2); margin: 18px 0 8px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 7px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .gridbox { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 5px; }
  .grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 1px; }
  .gcell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--f-num); font-size: 7px; font-weight: 600; letter-spacing: -.04em;
    background: #33475c; color: #9fb3c6; border-radius: 1px; overflow: hidden;
  }
  .gcell.lit { color: #fff; }

  .cta {
    display: block; width: 100%; padding: 16px; border-radius: 12px; background: var(--accent);
    color: #fff; font-size: 17px; font-weight: 600; margin: 18px 0 8px; letter-spacing: .02em;
  }
  .cta:active { background: #1a7590; }
  .cta.ghost { background: none; border: 1.5px solid var(--accent); color: var(--accent2); }

  /* 牌桌 */
  #screen-train { display: none; flex-direction: column; padding-bottom: 0; overflow: hidden; }
  #screen-train.on { display: flex; }
  .trainhead { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px 4px; }
  .counter { font-family: var(--f-num); font-size: 20px; font-weight: 700; }
  .tablebox { flex: 1; min-height: 0; overflow: hidden; padding: 2px 10px 6px; display: flex; align-items: center; justify-content: center; }
  .felt {
    position: relative; flex: none; --u: 4px;
    background: radial-gradient(ellipse at 50% 40%, var(--felt-a), var(--felt-b) 78%);
    border-radius: 44% / 28%;
    box-shadow: inset 0 0 0 calc(.7 * var(--u)) rgba(255,255,255,.12), 0 12px 30px rgba(0,0,0,.45);
  }
  .felt::after {
    content: ''; position: absolute; inset: calc(5 * var(--u)) calc(7 * var(--u));
    border: 1px solid rgba(255,255,255,.12); border-radius: 44% / 28%; pointer-events: none;
  }
  .seat { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; z-index: 2; }
  .seat .badge {
    width: calc(14.5 * var(--u)); height: calc(14.5 * var(--u)); border-radius: 50%; flex: none;
    background: #0d2137; border: calc(.55 * var(--u)) solid rgba(255,255,255,.88);
    display: flex; align-items: center; justify-content: center;
    font-size: calc(5.2 * var(--u)); font-weight: 700; z-index: 2;
  }
  .seat .stack {
    background: #12314d; border: calc(.5 * var(--u)) solid rgba(255,255,255,.82);
    border-radius: calc(2 * var(--u));
    padding: calc(1.5 * var(--u)) calc(2.6 * var(--u)) calc(1.5 * var(--u)) calc(4.6 * var(--u));
    margin-left: calc(-3.4 * var(--u));
    font-family: var(--f-num); font-size: calc(4.8 * var(--u)); white-space: nowrap;
  }
  .seat.folded { opacity: .3; }
  .seat.hero .badge { border-color: #fff; box-shadow: 0 0 calc(3 * var(--u)) rgba(255,255,255,.5); }
  .bet {
    position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center;
    gap: calc(1.5 * var(--u)); background: rgba(6,32,20,.88); border-radius: 999px;
    padding: calc(.9 * var(--u)) calc(2.8 * var(--u)) calc(.9 * var(--u)) calc(1.1 * var(--u));
    font-family: var(--f-num); font-size: calc(4.5 * var(--u)); white-space: nowrap; z-index: 3;
  }
  .bet b { width: calc(3.8 * var(--u)); height: calc(3.8 * var(--u)); border-radius: 50%; flex: none; background: #d8443a; border: calc(.5 * var(--u)) solid #fff; }
  .dealer {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: calc(6 * var(--u)); height: calc(6 * var(--u)); border-radius: 50%;
    background: #fff; color: #123; font-size: calc(3.2 * var(--u)); font-weight: 800;
    display: flex; align-items: center; justify-content: center; z-index: 3;
  }
  .dealer.r { left: calc(100% + 1.6 * var(--u)); }
  .dealer.l { right: calc(100% + 1.6 * var(--u)); }
  .pot { position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); text-align: center; }
  .pot small { display: block; font-size: calc(3.4 * var(--u)); color: rgba(255,255,255,.82); }
  .pot span { display: inline-block; margin-top: calc(.8 * var(--u)); background: rgba(6,40,24,.8); border-radius: 999px; padding: calc(.9 * var(--u)) calc(3.5 * var(--u)); font-family: var(--f-num); font-size: calc(5.2 * var(--u)); font-weight: 600; }
  .board { position: absolute; left: 50%; top: 37%; transform: translate(-50%, -50%); display: flex; gap: calc(1.5 * var(--u)); z-index: 3; }
  .bcard {
    width: calc(15 * var(--u)); aspect-ratio: 0.73; background: #fff; border-radius: calc(1.5 * var(--u)); color: #16202b;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 700; line-height: 1; box-shadow: 0 calc(.6 * var(--u)) calc(2 * var(--u)) rgba(0,0,0,.38);
  }
  .bcard .r { font-size: calc(7.6 * var(--u)); } .bcard .s { font-size: calc(5.6 * var(--u)); margin-top: 2px; }
  .bcard.red, .pcard.red, .mcard.red { color: #c22f26; }
  .hole { position: absolute; left: 50%; bottom: 17%; transform: translate(-50%, 0); display: flex; gap: calc(1 * var(--u)); z-index: 4; }
  .pcard {
    width: calc(16.5 * var(--u)); aspect-ratio: 0.73; background: #fff; border-radius: calc(1.5 * var(--u)); color: #16202b;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 700; line-height: 1; box-shadow: 0 calc(.8 * var(--u)) calc(2.5 * var(--u)) rgba(0,0,0,.45);
  }
  .pcard .r { font-size: calc(8.4 * var(--u)); } .pcard .s { font-size: calc(6.2 * var(--u)); margin-top: 2px; }

  .actions {
    flex: none; position: relative; z-index: 5;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
  }
  .act { padding: 18px 4px; border-radius: 12px; font-size: 16px; font-weight: 700; color: #fff; letter-spacing: .01em; }
  .act.fold { background: var(--btn-fold); } .act.call { background: var(--btn-call); } .act.raise { background: var(--btn-raise); }
  .act:active { filter: brightness(1.18); }

  .rangeover { position: absolute; inset: 0; background: rgba(8,20,34,.97); z-index: 30; padding: 16px; overflow-y: auto; }

  /* 揭示面板 */
  .scrim { position: absolute; inset: 0; background: rgba(4,12,22,.55); z-index: 10; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; top: 96px; z-index: 11;
    background: var(--bg); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
    display: flex; flex-direction: column; box-shadow: 0 -12px 30px rgba(0,0,0,.5);
  }
  .revhd { flex: none; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .verdict { font-size: 19px; font-weight: 700; }
  .chosen { font-family: var(--f-num); font-size: 13px; color: var(--muted); }
  .revbody { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 16px; }
  .revbody .lab:first-child { margin-top: 14px; }
  .revfoot { flex: none; padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  .revfoot .cta { margin: 0; padding: 15px; }

  .split { display: flex; height: 12px; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
  .split i { display: block; height: 100%; }
  .splitlab { display: flex; justify-content: space-between; font-family: var(--f-num); font-size: 12px; margin-bottom: 10px; }
  .brow { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .bn { width: 52px; font-size: 12.5px; color: var(--muted); }
  .btrk { flex: 1; height: 7px; background: var(--line); border-radius: 2px; position: relative; }
  .btrk i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
  .bv { width: 66px; text-align: right; font-family: var(--f-num); font-size: 12.5px; }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 8px; text-align: center; }
  .tile b { font-family: var(--f-num); font-size: 22px; font-weight: 700; display: block; }
  .tile span { font-size: 11.5px; color: var(--muted); margin-top: 2px; display: block; }

  .pctbar { display: flex; height: 26px; border-radius: 5px; overflow: hidden; }
  .pctbar i { display: block; height: 100%; }
  .mk { position: relative; height: 14px; }
  .mk i { position: absolute; top: 0; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 7px solid var(--text); }
  .zlab { display: flex; justify-content: space-between; font-family: var(--f-num); font-size: 11.5px; color: var(--muted); margin-top: -2px; }
  .zoneline { font-size: 14px; margin: 10px 0 0; }
  .zoneline b { font-family: var(--f-num); font-size: 17px; }

  .arow { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  .an { width: 92px; font-size: 13.5px; }
  .atrk { flex: 1; height: 20px; background: var(--card); border-radius: 4px; position: relative; }
  .atrk i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
  .av { width: 42px; text-align: right; font-family: var(--f-num); font-size: 15px; }
  .reason { background: var(--card); border-left: 3px solid var(--accent2); border-radius: 0 8px 8px 0; padding: 11px 13px; margin-top: 12px; font-size: 14px; line-height: 1.65; color: #c3d2e0; }

  /* 结算 */
  .resulthead { padding: 40px 20px 24px; text-align: center; }
  .score { font-size: 58px; font-weight: 800; font-family: var(--f-num); letter-spacing: -.02em; }
  .rating { font-size: 21px; font-weight: 700; margin-top: 4px; }
  .submeta { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .rlist { padding: 0 16px; }
  .rlist h3 { display: flex; align-items: center; gap: 9px; font-size: 16px; margin: 26px 0 10px; letter-spacing: .06em; }
  .rrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .mini { display: flex; gap: 3px; flex: none; }
  .mini.bd { opacity: .72; }
  .mcard { width: 28px; height: 38px; background: #fff; border-radius: 4px; color: #16202b; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; line-height: 1; }
  .mcard .r { font-size: 14px; } .mcard .s { font-size: 11px; }
  .mcard.sm { width: 21px; height: 29px; }
  .mcard.sm .r { font-size: 11px; } .mcard.sm .s { font-size: 9px; }
  .rinfo { flex: 1; min-width: 0; }
  .rgto { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-family: var(--f-num); }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .rmine { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* 通用 */
  .pad { padding: 18px 16px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .labx { font-size: 15px; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .seg { display: flex; background: var(--card); border-radius: 9px; padding: 3px; flex: none; }
  .seg button { padding: 7px 11px; border-radius: 7px; font-size: 13.5px; color: var(--muted); }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .modal { position: fixed; inset: 0; z-index: 100; padding: 28px; display: flex; align-items: center; justify-content: center; background: rgba(4,12,22,.74); }
  .modalbox { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: 100%; max-width: 320px; }
  .modalbox p { margin: 0 0 18px; font-size: 15px; }
  .modalrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mbtn { padding: 13px; border-radius: 9px; background: var(--card2); font-size: 15px; font-weight: 600; }
  .mbtn.danger { background: var(--btn-fold); color: #fff; }
  .help h3 { font-size: 16px; margin: 22px 0 6px; }
  .help p { margin: 0 0 10px; color: var(--muted); font-size: 14.5px; }

  /* 分析模式 */
  .anbox { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; margin-bottom: 14px; }
  .anhd { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .anhd .lab { margin: 0; }
  .anhd em { font-style: normal; font-family: var(--f-num); font-size: 11.5px; color: var(--muted); }
  .slots { display: flex; gap: 6px; }
  .slot {
    width: 46px; height: 63px; border-radius: 7px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-weight: 700; line-height: 1;
    background: #fff; color: #16202b; box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  .slot.red { color: #c22f26; }
  .slot .r { font-size: 22px; } .slot .s { font-size: 17px; margin-top: 2px; }
  .slot.empty { background: #0d2137; border: 1px dashed #2d4a68; color: var(--dim); box-shadow: none; font-size: 22px; font-weight: 400; }

  .picker { position: fixed; inset: 0; z-index: 120; background: rgba(4,12,22,.82); display: flex; align-items: flex-end; }
  .pickbox { background: var(--bg2); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 16px 14px calc(18px + env(safe-area-inset-bottom)); width: 100%; }
  .pickbox h4 { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
  .pickgrid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; }
  .pcell {
    aspect-ratio: 0.72; border-radius: 4px; background: #fff; color: #16202b;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 700; line-height: 1; font-size: 12px;
  }
  .pcell.red { color: #c22f26; }
  .pcell.used { opacity: .22; }
  .pcell small { font-size: 9px; }

  .editnote { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
  .gcell.edit { cursor: pointer; }
  .anlegend { display: flex; gap: 14px; margin-top: 9px; font-size: 12px; color: var(--muted); }
  .anlegend span { display: flex; align-items: center; gap: 6px; }
  .anlegend i { width: 11px; height: 11px; border-radius: 2px; }
</style>

<div id="app">
  <header class="topbar">
    <button id="nav-left" class="icon-btn" aria-label="返回"></button>
    <h1 id="nav-title">翻牌圈</h1>
    <button id="nav-right" class="txt-btn"></button>
  </header>
  <div class="screens">
    <section id="screen-home" class="screen on"></section>
    <section id="screen-sheet" class="screen"></section>
    <section id="screen-train" class="screen"></section>
    <section id="screen-analysis" class="screen"></section>
    <section id="screen-result" class="screen"></section>
    <section id="screen-settings" class="screen"></section>
    <section id="screen-help" class="screen"></section>
  </div>
</div>

<script>
/* 通用界面与存储原语，翻前与翻后两个应用共用。 */
(function (global) {
  'use strict';

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function rand(n) { return Math.floor(Math.random() * n); }
  function shuffled(a) {
    var c = a.slice();
    for (var i = c.length - 1; i > 0; i--) {
      var j = rand(i + 1); var t = c[i]; c[i] = c[j]; c[j] = t;
    }
    return c;

<script>
/* 范围记法解析器
 * 把 "TT+, AQs+, A5s:75, K9s-K5s, AKo" 这样的字符串展开成 169 手牌的频率表。
 * 记法：
 *   77+        对子 77 到 AA
 *   22-66      对子区间（写成 66-22 也可）
 *   A8s+       A8s 到 AKs
 *   K9s-K5s    同一张高牌的连续区间
 *   AKo        单个手牌
 *   任意 token 后加 :50 表示该动作频率 50%，省略为 100%
 */
(function (global) {
  'use strict';

  var RANKS = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
  var RIDX = {};
  for (var r = 0; r < RANKS.length; r++) RIDX[RANKS[r]] = r;

  // i = 高位牌索引，j = 低位牌索引；i<j 同花，i>j 非同花，i===j 对子
  function handKey(i, j) {
    if (i === j) return RANKS[i] + RANKS[j];
    if (i < j) return RANKS[i] + RANKS[j] + 's';
    return RANKS[j] + RANKS[i] + 'o';
  }

  function comboCount(i, j) {
    return i === j ? 6 : (i < j ? 4 : 12);
  }

  // 169 个格子，按 13x13 行列顺序
  var ALL_HANDS = [];
  for (var a = 0; a < 13; a++) {
    for (var b = 0; b < 13; b++) {
      ALL_HANDS.push({ i: a, j: b, key: handKey(a, b), combos: comboCount(a, b) });
    }
  }
  var COMBO_BY_KEY = {};
  ALL_HANDS.forEach(function (h) { COMBO_BY_KEY[h.key] = h.combos; });

  var TOTAL_COMBOS = 1326;

  function parseHand(txt) {
    var m = /^([AKQJT98765432])([AKQJT98765432])(s|o)?$/.exec(txt);
    if (!m) return null;
    var hi = RIDX[m[1]], lo = RIDX[m[2]], suit = m[3];
    if (hi === lo) return suit ? null : { type: 'pair', hi: hi, lo: lo };
    if (!suit) return null;
    if (hi > lo) { var t = hi; hi = lo; lo = t; }   // 允许写成 KAs
    return { type: suit === 's' ? 'suited' : 'offsuit', hi: hi, lo: lo };
  }

  function keyOf(h) {
    if (h.type === 'pair') return RANKS[h.hi] + RANKS[h.hi];
    return RANKS[h.hi] + RANKS[h.lo] + (h.type === 'suited' ? 's' : 'o');
  }

  function expandToken(token, errors) {
    var freq = 100;
    var body = token;
    var ci = token.indexOf(':');
    if (ci >= 0) {
      body = token.slice(0, ci).trim();
      freq = Number(token.slice(ci + 1).trim());
      if (!isFinite(freq) || freq < 0 || freq > 100) {
        errors.push('频率不合法：' + token);
        return [];
      }
    }

    var out = [];
    var plus = false;
    if (body.slice(-1) === '+') { plus = true; body = body.slice(0, -1).trim(); }

    if (body.indexOf('-') > 0) {
      var parts = body.split('-');
      if (parts.length !== 2) { errors.push('区间格式错误：' + token); return []; }
      var lhs = parseHand(parts[0].trim()), rhs = parseHand(parts[1].trim());
      if (!lhs || !rhs) { errors.push('无法识别的手牌：' + token); return []; }
      if (lhs.type !== rhs.type) { errors.push('区间两端类型不一致：' + token); return []; }
      if (lhs.type === 'pair') {
        var p1 = Math.min(lhs.hi, rhs.hi), p2 = Math.max(lhs.hi, rhs.hi);
        for (var p = p1; p <= p2; p++) out.push(RANKS[p] + RANKS[p]);
      } else {
        if (lhs.hi !== rhs.hi) { errors.push('区间高位牌不一致：' + token); return []; }
        var l1 = Math.min(lhs.lo, rhs.lo), l2 = Math.max(lhs.lo, rhs.lo);
        for (var l = l1; l <= l2; l++) {

        }
      }
    } else {
      var h = parseHand(body);
      if (!h) { errors.push('无法识别的手牌：' + token); return []; }
      if (plus) {
        if (h.type === 'pair') {

        cf = Math.max(0, 100 - rf);

      grid[h.key] = { raise: rf, call: cf, fold: last };
      w.raise += h.combos * rf / 100;
      w.call += h.combos * cf / 100;
    });

    var pctRaise = w.raise / TOTAL_COMBOS * 100;
    var pctCall = w.call / TOTAL_COMBOS * 100;

    if (sc.expect) {
      var total = pctRaise + pctCall;
      if (total < sc.expect[0] || total > sc.expect[1]) {
        errors.push('入池率 ' + total.toFixed(1) + '% 落在预期区间 ' +
          sc.expect[0] + '–' + sc.expect[1] + '% 之外');
      }
    }

    return {
      scenario: sc,
      grid: grid,
      pct: { raise: pctRaise, call: pctCall, total: pctRaise + pctCall },
      combos: { raise: w.raise, call: w.call },
      errors: errors
    };
  }

  function buildAll(scenarios) {
    return scenarios.map(buildScenario);
  }

  // 按组合数加权抽一手牌；weighting = 'combo' | 'flat'
  // focus 为真时，纯弃牌区只占 40%，避免整局都在按 Fold
  function dealHand(built, opts) {
    opts = opts || {};
    var pool = [];
    var foldOnly = [];
    ALL_HANDS.forEach(function (h) {
      var g = built.grid[h.key];
      var wgt = opts.weighting === 'flat' ? 1 : h.combos;
      var entry = { key: h.key, w: wgt };
      if (g.raise === 0 && g.call === 0) foldOnly.push(entry); else pool.push(entry);
    });
    var useFold = opts.focus === false
      ? Math.random() < 0.5
      : Math.random() < 0.4;
    var src = (useFold && foldOnly.length) ? foldOnly : (pool.length ? pool : foldOnly);
    var sum = src.reduce(function (s, e) { return s + e.w; }, 0);
    var pick = Math.random() * sum;
    for (var i = 0; i < src.length; i++) {
      pick -= src[i].w;
      if (pick <= 0) return src[i].key;
    }
    return src[src.length - 1].key;
  }

  // 判定：选择的动作频率 >= 阈值算对
  function judge(freqs, chosen, threshold) {
    var t = threshold == null ? 30 : threshold;
    var f = freqs[chosen] || 0;
    var best = Math.max(freqs.raise, freqs.call, freqs.fold);
    if (t === 'strict') return { correct: f >= best && f > 0, freq: f };
    return { correct: f >= t, freq: f, marginal: f > 0 && f < t };
  }

  global.Range = {
    RANKS: RANKS,
    ALL_HANDS: ALL_HANDS,
    TOTAL_COMBOS: TOTAL_COMBOS,
    handKey: handKey,
    comboCount: comboCount,
    parseRange: parseRange,
    buildScenario: buildScenario,
    buildAll: buildAll,
    dealHand: dealHand,
    judge: judge

})(typeof window !== 'undefined' ? window : this);

<script>
/* 牌桌渲染与自适应。调用方给出座位状态，这里只管画和量。
 * 翻前与翻后共用：翻后多传一个 board 数组即可。
 */
(function (global) {
  'use strict';

  var el = UI.el, num = UI.num;

  var ORDER = ['UTG', 'HJ', 'CO', 'BTN', 'SB', 'BB'];
  var SUITS = { s: '♠', h: '♥', d: '♦', c: '♣' };
  var RED = { h: 1, d: 1 };

  // 座位坐标：slot 0 是英雄，逆时针依次是后面行动的位置。
  // x/y 是座位中心，bx/by 是下注筹码，都是牌桌的百分比。

  var SLOTS = [
    { x: 50, y: 89, bx: 50, by: 62, dside: 'l' },
    { x: 20, y: 60, bx: 34, by: 50, dside: 'r' },
    { x: 20, y: 33, bx: 34, by: 43, dside: 'r' },
    { x: 50, y: 10, bx: 50, by: 18, dside: 'l' },
    { x: 80, y: 33, bx: 66, by: 43, dside: 'l' },
    { x: 80, y: 60, bx: 66, by: 50, dside: 'l' }
  ];

  function cardNode(c, cls) {
    var n = el('div', cls + (RED[c[1]] ? ' red' : ''));
    n.appendChild(el('div', 'r', c[0]));
    n.appendChild(el('div', 's', SUITS[c[1]]));
    return n;
  }

  // 把 "A5s" 这样的等价类展开成两张带花色的具体牌
  function dealCards(key) {
    var r1 = key[0], r2 = key[1], type = key[2];
    var s = UI.shuffled(['s', 'h', 'd', 'c']);

    if (type === 's') return [r1 + s[0], r2 + s[0]];
    return [r1 + s[0], r2 + s[1]];
  }

  // 牌桌尺寸由 JS 量算：填满可用区域，但不允许比宽度的 1.67 倍更高。

    var H = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);

      return;

    var w = Math.min(W, 560);
    var h = Math.min(H, w / 0.6);
    felt.style.width = Math.round(w) + 'px';
    felt.style.height = Math.round(h) + 'px';
    // 元素尺寸取宽高里更紧的那一维，桌子被压扁时元素跟着缩，不会互相压到

      if (seat.bet > 0 && !seat.folded) {
        var bet = el('div', 'bet');
        bet.style.left = S.bx + '%';
        bet.style.top = S.by + '%';
        bet.appendChild(el('b'));
        bet.appendChild(el('span', null, num(seat.bet) + ' BB'));
        felt.appendChild(bet);

  }

  global.Table = {
    ORDER: ORDER, SUITS: SUITS, RED: RED, SLOTS: SLOTS,

    fit: fit, watch: watch, render: render

})(typeof window !== 'undefined' ? window : this);

<script>
/* 牌力评估与手牌分类。
 * 输入是 ['As','Kd'] 这种字符串，与 table.js 用的格式一致。
 * 输出是说明书第 5 节定义的八类之一。

(function (global) {
  'use strict';

  var RANK_CH = '23456789TJQKA';
  function val(ch) { return RANK_CH.indexOf(ch) + 2; }
  function rankOf(card) { return val(card[0]); }
  function suitOf(card) { return card[1]; }

  var CLASSES = [
    '超强牌', '强顶对及以上', '弱顶对', '中对底对',
    '强听牌', '普通听牌', '弱牌有潜力', '空气'

  function counts(list) {

    list.forEach(function (v) { c[v] = (c[v] || 0) + 1; });

  function hasStraight(vals) {

    var quads = false, trips = false, pairRanks = [];

<script>
/* 胜率引擎：牌力评估、范围展开、当前强弱、胜率、范围分位。
 *
 * 牌用 'As' 'Kd' 这种两字符串，与 table.js 和 cards.js 一致。
 * 翻牌圈还剩两张公共牌要发，所有"胜率"都指算到河牌。

(function (global) {
  'use strict';

  var RANKS = '23456789TJQKA';
  var SUITS = 'shdc';

  var DECK = [];
  for (var r = 0; r < 13; r++) {
    for (var s = 0; s < 4; s++) DECK.push(RANKS[r] + SUITS[s]);
  }

   * 五张牌评分成一个整数，大的赢。分值构造：

    else if (shape.charAt(0) === '4') cat = 7;
    else if (shape === '32') cat = 6;
    else if (flush) cat = 5;
    else if (straight) cat = 4;
    else if (shape.charAt(0) === '3') cat = 3;
    else if (shape.slice(0, 2) === '22') cat = 2;
    else if (shape.charAt(0) === '2') cat = 1;

      for (var c = b + 1; c < 7; c++) for (var d = c + 1; d < 7; d++)
        for (var e = d + 1; e < 7; e++) SUB7.push([a, b, c, d, e]);

   */

      var i = (Math.random() * live.length) | 0;
      var j = (Math.random() * live.length) | 0;

        [vs[s[0]], vs[s[1]], vs[s[2]], vs[s[3]], vs[s[4]]],
        [ss[s[0]], ss[s[1]], ss[s[2]], ss[s[3]], ss[s[4]]]

    }

  function improveOuts(hero, board) {

      acc += gw; k = e;
    }

    var opp = O.slice().sort(function (a, b) { return b.eq - a.eq; });
    var oppTotal = opp.reduce(function (s, x) { return s + x.w; }, 0);

    mine.forEach(function (r) { byKey[r.key] = r; });

   * 边界上那一手按比例部分计入，不做四舍五入。
   */

    var need = an.oppTotal / (1 + f);
    var rows = [], acc = 0;
    for (var i = 0; i < an.opp.length && acc < need - 1e-12; i++) {
      var r = an.opp[i];
      var take = Math.min(r.w, need - acc);
      rows.push({ cards: r.cards, score: r.score, t6: r.t6, w: take, eq: r.eq });
      acc += take;
    }
    return { rows: rows, weight: acc, mdf: 1 / (1 + f), f: f };
  }

  // 我这手牌对上那部分续战范围的摊牌领先率。撞到我手牌的组合当然不存在。
  function vsSet(cards, board, set) {
    var my = best5(cards.concat(board));
    var ahead = 0, tie = 0, live = 0;
    for (var i = 0; i < set.rows.length; i++) {
      var r = set.rows[i];
      if (conflict(cards, r.cards)) continue;
      live += r.w;
      if (my > r.score) ahead += r.w;
      else if (my === r.score) tie += r.w;
    }
    return {
      ahead: live ? ahead / live * 100 : 0,
      tie: live ? tie / live * 100 : 0,
      score: live ? (ahead + tie / 2) / live * 100 : 0,
      live: live

  }

  /* ---------------- 被跟之后还剩多少胜率 ----------------
   * 摊牌领先率只说「现在」。可是被跟注的那部分范围还会发两张牌，
   * 一副被高牌围着的小对子现在领先，打到河牌却往往已经输了。
   * 价值下注要问的是后者，不是前者。
   *
   * 精确到河牌要枚举 990 种转河再乘上整条范围，一个牌面要十几秒，做不到。
   * 这里走一条便宜的路：45 张转牌逐一精确算出「发完这张之后我还领先多少」，
   * 与现在的领先率之差就是这条街的漂移，还要发两张，所以线性外推乘二。
   *
   * 这是近似，不是精确值。听牌在转牌中了就不会在河牌再中一次，所以听牌

    for (j = 0; j < set.rows.length; j++) {

    var a = 0, w = 0;
    for (j = 0; j < rows.length; j++) {

      else if (row.score === rows[j].score) a += rows[j].w / 2;

    var acc = 0, n = 0;

        else if (my === s) aa += rows[j].w / 2;

   * 我手里两张牌会把对手的一部分组合杀掉。关键不是杀了多少，
   * 而是杀「续战的」比杀「全部的」多多少：多出来的那一块就是阻断收益。
   * 平均续战比例恰好等于 MDF，所以这个差额是有基准可比的。

    for (i = 0; i < an.opp.length; i++) {

    }

    return {
      contFrac: contFrac * 100,
      base: base * 100,
      block: (base - contFrac) * 100,
      foldFrac: (1 - contFrac) * 100

  }

  /* ---------------- 旧接口 ----------------
   * rangeLadder / percentileOf 保持原样，老的校验页与界面继续能用。
   */
  function rangeLadder(board, heroBuilt, heroAction, oppBuilt, oppAction) {

    return {
      percentile: r.below / ladder.total * 100,
      ahead: r.ahead, row: r, inRange: true

  function clearCache() { anCache = {}; }

  global.Equity = {
    DECK: DECK, RANKS: RANKS, SUITS: SUITS,
    val: val, suit: suit, handKeyOf: handKeyOf, conflict: conflict,
    score5: score5, best5: best5, best6: best6, best7: best7, catOf: catOf,
    expandRange: expandRange, showdown: showdown,

<script>
/* 分区模型：把胜率与范围分位变成动作建议。
 *
 * 设计原则是把"我定的"和"算出来的"分得干干净净：
 *
 *   自由常数只有两个，写在 CONST 里，可在设置里改：
 *     valueWidth  进攻方价值区占范围的比例
 *     raiseWidth  防守方加注区占范围的比例
 *
 *   其余全部由数学导出，没有调参空间：
 *     诈唬区宽度  = 价值区宽度 × 诈唬比 ÷ (1 − 诈唬比)，诈唬比由下注尺度的赔率决定
 *     弃牌区宽度  = 1 − 最小防守频率，同样由所面对的下注尺度决定
 *     分位         由 equity.js 按当前领先率排序算出
 *     价值闸       被跟之后打到河牌还剩多少胜率，由对手续战范围逐张转牌算出
 *     诈唬排队     由诈唬与过牌的期望值之差算出，出张与阻断都在里面
 *
 * 不做的事：不推导"下注总频率"。四种推导方式都试过并失败，记录在
 * docs/flop-strategy.html 的第一节。分区边界是明说的常数，不假装是推出来的。
 */
(function (global) {
  'use strict';

  var CONST = {
    valueWidth: 50,   // 进攻方：按当前领先率排序，顶部这么多比例走价值下注
    raiseWidth: 18,   // 防守方：顶部这么多比例走加注
    edge: 5           // 边界容差：距离边界这么近时，相邻两个动作都判对
  };

  /* ---------------- 纯数学部分 ---------------- */

  // 下注 f 倍底池时，为了让对手的跟注无差异，诈唬应占下注总量的这个比例。
  // 对手跟 f 要赢 1+f，所需胜率 f/(1+2f)，这也正是诈唬占比。
  function bluffShare(f) { return f / (1 + 2 * f); }

  // 面对 f 倍底池的下注，最小防守频率。防守不足对方任意两张牌诈唬都赚。
  function mdf(f) { return 1 / (1 + f); }

  // 价值区宽度定了，诈唬区宽度就定了
  function bluffWidth(valueWidth, f) {
    var b = bluffShare(f);
    return valueWidth * b / (1 - b);
  }

  /* ---------------- 进攻方分区 ---------------- */
  /* percentile 是这手牌在我方范围里按当前领先率排的位置，0 最弱 100 最强。
   * 返回落在哪个区，以及该区对应的动作与建议尺度。 */
  function aggressorZones(smallFrac, bigFrac, opts) {
    var V = (opts && opts.valueWidth) || CONST.valueWidth;
    // 诈唬用哪个尺度，宽度就按哪个尺度算。两档各自的诈唬容量取加权。
    var wSmall = bluffWidth(V, smallFrac);
    var wBig = bluffWidth(V, bigFrac);
    return {
      valueFrom: 100 - V,
      bluffTo: (wSmall + wBig) / 2,
      bluffWidthSmall: wSmall,
      bluffWidthBig: wBig,
      valueWidth: V
    };
  }

  /* ---------------- 防守方分区 ---------------- */
  function defenderZones(facingFrac, opts) {
    var R = (opts && opts.raiseWidth) || CONST.raiseWidth;
    var foldWidth = (1 - mdf(facingFrac)) * 100;
    return {
      foldTo: foldWidth,
      raiseFrom: 100 - R,
      foldWidth: foldWidth,
      raiseWidth: R,
      mdf: mdf(facingFrac) * 100
    };
  }

  /* ---------------- 尺度选择 ----------------
   * 大注占下注量的比例由牌面结构决定。干燥面几乎全用小注，
   * 连接面与同花面需要更多大注来收保护费。双色面再加一档。
   * 这是第三处判断，但它只影响尺度不影响是否下注，而且一眼可议。 */
  var BIG_SHARE = {
    'A 高干燥': 15, 'KQ 高干燥': 15, 'JT 高干燥': 20, '低干燥': 20,
    '配对面': 15, '连接面': 45, '同花面': 40
  };

  function bigShare(structure, suitAxis) {
    var b = BIG_SHARE[structure];
    if (b == null) b = 25;
    if (suitAxis === '双色') b += 10;
    return Math.min(b, 60);
  }

  /* ---------------- 三道由期望值决定的闸 ----------------
   * 分区回答"多少牌该下注"，但没回答"哪几手"。下面三件事补上这一步，
   * 全部由赔率与枚举导出，没有新增可调常数。
   *
   *   一、价值闸：下注取价值的前提是更差的牌还会跟，而且跟下来之后你还赢得了。
   *       拿我这手牌去打对手的续战范围，打到河牌的胜率不到一半就不是价值下注。
   *       用的是胜率不是当前领先率：小对子现在领先、打完两张牌却输了的情况太常见。
   *   二、诈唬排队：诈唬名额由赔率定死，但名额该给谁，按诈唬与过牌的
   *       期望值之差排队 —— 出张多的自然排在前面。
   *   三、阻断：对手的续战比例不是一个固定数，我手里这两张牌会改变它，
   *       挡住的续战牌越多，对手弃牌越多，诈唬的期望值越高。
   */

  // 「被跟之后打到河牌还剩多少胜率」由 equity.js 的 calledEquity 算出：
  // 它同时装下了我的出张与对手的反超，所以这里不再另外加出张。

  // 下注之后赢下这个底池的概率：他弃牌我直接赢，他跟注我还有 calledEq
  function winIfBet(foldPct, calledEq) {
    return foldPct + (100 - foldPct) * calledEq / 100;
  }

  /* 诈唬排队分：下注比过牌多赢多少概率。
   * 出张多 → calledEq 高；阻断强 → foldPct 高；摊牌价值高 → 减得多。
   * 三件事已经是同一个单位（概率），不需要再配权重，所以这里没有可调常数。
   *
   * 明说的假设：过牌那一侧只按当前摊牌领先率计，不计过牌之后还能改进。
   * 一条街的模型算不出过牌之后的实现率，与其塞一个实现率参数，不如把
   * 过牌这边算保守，并把这件事写在这里。
   */
  function bluffScore(foldPct, calledEq, showdownNow) {
    return winIfBet(foldPct, calledEq) - showdownNow;
  }

  /* 整条范围一起算，然后分配诈唬名额。名额必须整条范围一起分，
   * 单看一手牌是分不出来的 —— 这正是原来那版缺的一步。 */
  function planAggressor(an, sizes, opts) {
    var E = global.Equity;
    var V = (opts && opts.valueWidth) || CONST.valueWidth;
    var board = an.board;
    // 两档尺度各有各的续战范围：大注逼走的牌多，能被大注跟的更差的牌就少
    var setS = E.continueSet(an, sizes.small);
    var setB = E.continueSet(an, sizes.big);

    var recs = an.mine.map(function (r) {
      var cs = E.calledEquity(r, setS);
      var bl = E.blockers(r.cards, an, setS);
      return {
        key: r.key, cards: r.cards, w: r.w, pct: r.pct, eq: r.eq, outs: r.outs,
        ahead: r.ahead, row: r,
        calledAhead: cs.showdown, calledEq: cs.est, calledTurn: cs.turn,
        calledAheadBig: null, calledEqBig: null, bigOK: false,
        foldFrac: bl.foldFrac, block: bl.block, contFrac: bl.contFrac,
        score: bluffScore(bl.foldFrac, cs.est, r.ahead),
        zone: 'check'
      };
    });

    /* 一、价值闸：分位够高只是入场券。真正的问题是被跟之后打到河牌还剩多少胜率。
     * 这里用的不是「现在领先多少」—— 一副被高牌围着的小对子现在领先，
     * 打完两张牌却往往已经输了，下注只会把它送进一个赢不了的底池。 */
    var valueW = 0;
    recs.forEach(function (x) {
      if (x.pct < 100 - V || x.calledEq < 50) return;
      x.zone = 'value'; valueW += x.w;
      // 过了小注这关才值得再问大注：大注逼走的牌多，能跟的更差的牌就少
      var cb = E.calledEquity(x.row, setB);
      x.calledAheadBig = cb.showdown; x.calledEqBig = cb.est; x.bigOK = cb.est >= 50;
    });
    var valuePct = an.total ? valueW / an.total * 100 : 0;

    // 二、诈唬名额按实际打出去的价值量算：价值被闸掉多少，诈唬跟着少多少
    var cap = (bluffWidth(valuePct, sizes.small) + bluffWidth(valuePct, sizes.big)) / 2;
    var capW = an.total * cap / 100;

    // 三、名额给排队分最高的，且只给下注确实提高胜率的牌
    var pool = recs.filter(function (x) { return x.zone !== 'value' && x.score > 0; });
    pool.sort(function (a, b) { return b.score - a.score; });
    var acc = 0;
    for (var i = 0; i < pool.length && acc < capW; i++) { pool[i].zone = 'bluff'; acc += pool[i].w; }

    var byKey = {};
    recs.forEach(function (x) { byKey[x.key] = x; });
    return {
      role: 'aggressor', byKey: byKey, recs: recs, set: setS, setBig: setB,
      valuePct: valuePct, nominalValuePct: V, bluffCapPct: cap,
      bluffPct: an.total ? acc / an.total * 100 : 0, poolSize: pool.length
    };
  }

  /* 防守方。b 是所面对的下注，加注到 b 的 mult 倍。 */
  function planDefender(an, facingFrac, raiseMult, opts) {
    var E = global.Equity;
    var R = (opts && opts.raiseWidth) || CONST.raiseWidth;
    var board = an.board;
    var b = facingFrac, rTo = raiseMult * b;
    // 对手面对我的加注要补的钱，占他决策时底池的比例
    var fTheirs = (rTo - b) / (1 + b + rTo);
    var set = E.continueSet(an, fTheirs);
    var foldTo = (1 - mdf(b)) * 100;

    var recs = an.mine.map(function (r) {
      var cs = E.calledEquity(r, set);
      var bl = E.blockers(r.cards, an, set);
      return {
        key: r.key, cards: r.cards, w: r.w, pct: r.pct, eq: r.eq, outs: r.outs,
        ahead: r.ahead, row: r,
        calledAhead: cs.showdown, calledEq: cs.est, calledTurn: cs.turn,
        foldFrac: bl.foldFrac, block: bl.block, contFrac: bl.contFrac,
        score: bluffScore(bl.foldFrac, cs.est, r.ahead),
        valueRaise: false,
        zone: 'call'
      };
    });

    var raiseW = 0;
    recs.forEach(function (x) {
      if (x.pct <= foldTo) x.zone = 'fold';
      if (x.pct >= 100 - R && x.calledEq >= 50) {
        x.zone = 'raise'; x.valueRaise = true; raiseW += x.w;
      }
    });
    var raisePct = an.total ? raiseW / an.total * 100 : 0;

    var cap = bluffWidth(raisePct, fTheirs);
    var capW = an.total * cap / 100;
    var pool = recs.filter(function (x) { return !x.valueRaise && x.score > 0; });
    pool.sort(function (a, c) { return c.score - a.score; });
    var acc = 0;
    for (var i = 0; i < pool.length && acc < capW; i++) { pool[i].zone = 'raise'; acc += pool[i].w; }

    var byKey = {};
    recs.forEach(function (x) { byKey[x.key] = x; });
    return {
      role: 'defender', byKey: byKey, recs: recs, set: set,
      foldTo: foldTo, raiseValuePct: raisePct, bluffCapPct: cap,
      raiseBluffPct: an.total ? acc / an.total * 100 : 0,
      facing: b, raiseTo: rTo, fTheirs: fTheirs
    };
  }

  /* ---------------- 主入口 ---------------- */
  /* 进攻方。pct 是分位，det 是这手牌在 planAggressor 里的那条记录。
   * 不给 det 时退回只看分位的老逻辑，校验页用它单独考分区边界。 */
  function adviseAggressor(pct, board, sizes, opts, det) {
    var z = aggressorZones(sizes.small, sizes.big, opts);
    var big = bigShare(board.structure, board.suit);
    var zone, why;

    if (det) {
      zone = det.zone;
      if (zone === 'value') {
        why = '排在你范围顶部，被跟之后打到河牌仍有 ' +
          Math.round(det.calledEq) + '% 胜率，更差的牌会跟，下注取价值';
      } else if (zone === 'bluff') {
        why = '没有摊牌价值，但有 ' + det.outs + ' 张出张' +
          (det.block > 0.5 ? '，还挡住了对手一部分续战牌' : '') +
          '，诈唬比过牌值钱';
      } else if (pct >= z.valueFrom && det.calledAhead >= 50) {
        why = '现在是领先的，但被跟之后打到河牌只剩 ' + Math.round(det.calledEq) +
          '% 胜率：跟你的那些牌后面还会反超你。过牌保住摊牌价值';
      } else if (pct >= z.valueFrom) {
        why = '看着靠前，但跟你的那部分范围里你只有 ' + Math.round(det.calledEq) +
          '% 胜率，更差的牌不会跟，下注反而吃亏，过牌';
      } else {
        why = '不上不下，下注会被更好的跟、更差的弃，过牌保住摊牌价值';
      }
    } else {
      if (pct >= z.valueFrom) { zone = 'value'; why = '这手牌排在你范围的顶部，下注取价值'; }
      else if (pct <= z.bluffTo) { zone = 'bluff'; why = '这手牌排在你范围的底部，没有摊牌价值，正是该诈唬的位置'; }
      else { zone = 'check'; why = '这手牌不上不下，下注会被更好的跟、更差的弃，过牌保住摊牌价值'; }
    }

    var w;
    if (zone === 'check') w = { bet33: 0, bet75: 0, check: 100 };
    else if (det && zone === 'value' && !det.bigOK) {
      // 小注能被更差的牌跟，大注不能：那就只用小注
      w = { bet33: 100, bet75: 0, check: 0 };
    } else w = { bet33: Math.round(100 - big), bet75: Math.round(big), check: 0 };

    return {
      zone: zone, zones: z, why: why, weights: w, detail: det || null,
      near: nearBoundary(pct, [z.bluffTo, z.valueFrom], opts)
    };
  }

  /* 防守方。facing 是所面对的下注占底池的比例。 */
  function adviseDefender(pct, facingFrac, opts, det) {
    var z = defenderZones(facingFrac, opts);
    var zone, why;

    if (det) {
      zone = det.zone;
      if (zone === 'raise' && det.valueRaise) {
        why = '排在你范围顶部，被跟之后打到河牌仍有 ' + Math.round(det.calledEq) + '% 胜率，加注取价值';
      } else if (zone === 'raise') {
        why = '没有摊牌价值，但有 ' + det.outs + ' 张出张' +
          (det.block > 0.5 ? '，还挡住了对手一部分续战牌' : '') +
          '，加注当诈唬比跟注值钱';
      } else if (zone === 'fold') {
        why = '排在你范围底部，赔率不够，当诈唬加注也不划算，弃牌';
      } else if (pct >= z.raiseFrom) {
        why = '看着靠前，但被跟之后打到河牌只剩 ' + Math.round(det.calledEq) +
          '% 胜率，加注只会赶走更差的牌、留下打得过你的，跟注';
      } else {
        why = '够格继续但不够格加注，跟注保住摊牌价值';
      }
    } else {
      if (pct <= z.foldTo) { zone = 'fold'; why = '这手牌排在你范围的底部，赔率不够，弃牌'; }
      else if (pct >= z.raiseFrom) { zone = 'raise'; why = '这手牌排在你范围的顶部，加注取价值'; }
      else { zone = 'call'; why = '够格继续但不够格加注，跟注保住摊牌价值'; }
    }

    var w = zone === 'fold' ? { fold: 100, call: 0, raise: 0 }
      : zone === 'raise' ? { fold: 0, call: 0, raise: 100 }
      : { fold: 0, call: 100, raise: 0 };

    return {
      zone: zone, zones: z, why: why, weights: w, detail: det || null,
      near: nearBoundary(pct, [z.foldTo, z.raiseFrom], opts)
    };
  }

  // 距离任一边界不超过容差时，相邻动作也判对。分区边界是我定的常数，
  // 不该因为差一个百分点就把人判错。
  function nearBoundary(pct, bounds, opts) {
    var e = (opts && opts.edge != null) ? opts.edge : CONST.edge;
    for (var i = 0; i < bounds.length; i++) {
      if (Math.abs(pct - bounds[i]) <= e) return true;
    }
    return false;
  }

  /* 判对错：动作落在本区即对；贴边时相邻区的动作也算对。 */
  function judge(advice, chosen, role) {
    var order = role === 'defender' ? ['fold', 'call', 'raise'] : ['bluff', 'check', 'value'];

   * 优先级：自定义 > 预设 > 翻前原始数据。

    var p = OPP_PRESETS[presetName];

    // 翻牌圈只剩两人，其余位置整个不画
    var seats = ORDER.map(function (p) {
      return { pos: p, folded: false, hidden: true, bet: 0, hero: p === sc.hero };
    });
    seats[idx[sc.hero]].hidden = false;
    seats[idx[sc.opp]].hidden = false;
    // 翻牌圈底池已经形成，翻前投入不再单独显示，只显示本圈的下注
    if (sc.role === 'defender') {
      seats[idx[sc.opp]].bet = betAmt(sc, sc.facing);
    }
    if (acted && acted.amount) seats[idx[sc.hero]].bet = acted.amount;
    var extra = seats.reduce(function (s, x) { return s + x.bet; }, 0);
    return { seats: seats, pot: sc.pot + extra };
  }

  /* ---------------- 计算 ---------------- */
  // 把战胜我的组合按牌型分组
  function beatBreakdown(hero, board, range) {
    var my5 = E.best5(hero.concat(board));
    var bv = board.map(function (c) { return E.val(c); }).sort(function (a, b) { return b - a; });
    var g = {}, tot = 0, ahead = 0, tie = 0;
    range.forEach(function (o) {
      tot += o.w;
      var th = E.best5(o.cards.concat(board));
      if (th < my5) { ahead += o.w; return; }
      if (th === my5) { tie += o.w; return; }
      var all = o.cards.concat(board).map(function (c) { return E.val(c); });
      var cnt = {};
      all.forEach(function (v) { cnt[v] = (cnt[v] || 0) + 1; });
      var trips = Object.keys(cnt).filter(function (k) { return cnt[k] >= 3; });
      var pairs = Object.keys(cnt).filter(function (k) { return cnt[k] === 2; });
      var r = Cards.read(o.cards, board);
      var name;
      if (r.flush) name = '同花';
      else if (r.straight) name = '顺子';
      else if (trips.length) name = '三条';
      else if (pairs.length >= 2) name = '两对';
      else if (pairs.length === 1) {
        var p = +pairs[0];
        name = p === bv[0] ? '顶对' : p === bv[1] ? '中对' : p === bv[2] ? '底对' : '口袋对';
      } else name = '高牌';
      g[name] = (g[name] || 0) + o.w;
    });
    var list = Object.keys(g).map(function (k) {
      return { name: k, w: g[k], pct: g[k] / tot * 100 };
    }).sort(function (a, b) { return b.w - a.w; });
    return {
      list: list, total: tot, combos: range.length,
      ahead: ahead / tot * 100, tie: tie / tot * 100,
      behind: (tot - ahead - tie) / tot * 100
    };
  }

  /* 分区方案要整条范围一起算：诈唬名额只有拿全范围排队才分得出来。
   * 一个牌面一份，与胜率阶梯共用同一个缓存生命周期。 */
  var planCache = {};

  function planOf(sc, board) {
    var st = St.data.settings;
    var ck = sc.id + '|' + board.join('') + '|' + st.valueWidth + '|' + st.raiseWidth;
    if (planCache[ck]) return planCache[ck];
    var an = E.analyze(board, heroBuilt(sc), heroAction(sc), oppBuilt(sc), oppAction(sc));
    var opts = { valueWidth: st.valueWidth, raiseWidth: st.raiseWidth };
    var p = sc.role === 'aggressor'
      ? S.planAggressor(an, sc.sizes, opts)
      : S.planDefender(an, sc.facing, sc.raiseMult, opts);
    p.an = an;
    planCache[ck] = p;
    return p;
  }

  // 范围改了、对手预设换了、常数调了，两份缓存一起清
  function clearCalc() { planCache = {}; E.clearCache(); }

  function analyse(sc, board, hole) {
    var oppRange = E.expandRange(oppBuilt(sc), oppAction(sc), board.concat(hole));
    var bd = beatBreakdown(hole, board, oppRange);
    var eq = E.equityVsRange(hole, board, oppRange, 6000);
    var plan = planOf(sc, board);
    // 分析模式里可以摆出不在自己范围内的牌，那时没有分位也就没有建议
    var det = plan.byKey[hole.slice().sort().join('')] || null;
    var bcls = Board.classify(board);
    var opts = { valueWidth: St.data.settings.valueWidth, raiseWidth: St.data.settings.raiseWidth };
    var adv = !det ? null
      : sc.role === 'aggressor'
        ? S.adviseAggressor(det.pct, bcls, sc.sizes, opts, det)
        : S.adviseDefender(det.pct, sc.facing, opts, det);
    return {
      breakdown: bd, equity: eq.equity, stderr: eq.stderr,
      ahead: bd.ahead, delta: eq.equity - bd.ahead,
      pct: det ? det.pct : null, board: bcls, advice: adv,
      detail: det, plan: plan,
      hand: Cards.read(hole, board)
    };
  }

  /* ---------------- 范围网格 ---------------- */
  function rangeGrid(built, action, heat) {
    var box = el('div', 'gridbox');
    var grid = el('div', 'grid');
    Range.ALL_HANDS.forEach(function (h) {
      var g = built.grid[h.key];
      var f = g ? g[action] : 0;
      var rec = heat ? heat[h.key] : null;
      var cell = el('div', 'gcell' + ((heat ? (rec && rec.n) : f >= 50) ? ' lit' : ''), h.key);
      cell.style.background = heat ? heatFill(rec)
        : f === 0 ? '#33475c'
        : 'linear-gradient(to top, #33475c 0 ' + (100 - f) + '%, var(--btn-call) ' + (100 - f) + '% 100%)';
      grid.appendChild(cell);
    });
    box.appendChild(grid);
    return box;
  }
  function rangePct(built, action) {
    var w = 0;
    Range.ALL_HANDS.forEach(function (h) {
      var g = built.grid[h.key];
      if (g) w += h.combos * g[action] / 100;
    });
    return { pct: w / 1326 * 100, combos: Math.round(w) };
  }

  /* ---------------- 训练 ---------------- */
  var session = null;

  function startSession(sc, queue, title) {
    session = {
      sc: sc, queue: queue || null, i: 0, answers: [],
      total: queue ? queue.length : St.data.settings.hands,
      title: title || (sc.group + ' · ' + sc.hero)
    };
    show('train');
    nextHand();
  }

  function dealHand(sc) {
    var mine = E.expandRange(heroBuilt(sc), heroAction(sc), []);
    var pick = mine[rand(mine.length)];
    var guard = 0;
    while (pick.w < 1 && Math.random() > pick.w && guard++ < 60) pick = mine[rand(mine.length)];
    var board = Board.randomFlop(pick.cards);
    return { hole: byRank(pick.cards), board: board };
  }

  // 展开范围时牌是按牌堆顺序出来的，显示前按点数从大到小排
  function byRank(cards) {
    return cards.slice().sort(function (a, b) { return E.val(b) - E.val(a); });
  }

  function nextHand() {
    var sc = session.sc, hole, board;
    if (session.queue) {
      var q = session.queue[session.i];
      sc = BY_ID[q.id] || sc;
      session.sc = sc;
      hole = q.hole; board = q.board;
    } else {
      var d = dealHand(sc);
      hole = d.hole; board = d.board;
    }
    session.cur = { sc: sc, hole: hole, board: board, result: null };
    renderTrain();
    // 牌桌先画出来，分位阶梯在后台算，用户抬手时通常已经算完
    setTimeout(function () {
      if (session && session.cur && session.cur.board === board) {
        planOf(sc, board);
      }
    }, 0);
  }

  function renderTrain() {
    var c = session.cur, sc = c.sc;
    setNav(session.title,
      { label: '✕', fn: quitSession },
      { label: '范围', fn: function () { toggleRange(sc); } });
    navLeft.className = 'icon-btn';
    navRight.className = 'txt-btn';

    var root = document.getElementById('screen-train');
    clear(root);

    var head = el('div', 'trainhead');
    head.appendChild(el('div', 'counter', (session.i + 1) + ' / ' + session.total));
    var pot = el('div', 'counter', '底池 ' + tableState(sc).pot + ' BB');
    pot.style.cssText = 'font-size:14px;color:var(--muted);font-weight:500';
    head.appendChild(pot);
    root.appendChild(head);

    var box = el('div', 'tablebox');
    var st = tableState(sc);
    var felt = Table.render({
      seats: st.seats, heroPos: sc.hero, pot: st.pot,
      hole: c.hole, board: c.board
    });
    box.appendChild(felt);
    root.appendChild(box);

    var acts = el('div', 'actions');
    sc.actions.forEach(function (k) {
      var cls = sc.role === 'aggressor'
        ? (k === 'bet33' ? 'raise' : k === 'bet75' ? 'fold' : 'call')
        : (k === 'fold' ? 'fold' : k === 'call' ? 'call' : 'raise');
      var b = el('button', 'act ' + cls, actionLabel(sc, k));
      b.onclick = function () { answer(k); };
      acts.appendChild(b);
    });
    root.appendChild(acts);

    Table.fit(felt);
  }

  function answer(chosen) {
    if (!session || session.done || session.cur.result) return;
    var c = session.cur, sc = c.sc;
    var a = analyse(sc, c.board, c.hole);
    var v = S.judge(a.advice, chosen, sc.role);
    c.result = { chosen: chosen, analysis: a, verdict: v };

    var s = statOf(sc.id);
    s.hands++;
    if (v.correct) s.correct++; else s.wrong++;
    var key = a.board.structure + ' / ' + a.hand.cls;
    var bh = s.byHand[key] || (s.byHand[key] = { n: 0, correct: 0 });
    bh.n++;
    if (v.correct) { bh.correct++; St.clearMistake(sc.id, handKey(c)); }
    else St.noteMistake(sc.id, handKey(c), chosen);
    saveStore();

    session.answers.push({
      id: sc.id, hole: c.hole, board: c.board,
      chosen: chosen, correct: v.correct, marginal: v.marginal, a: a
    });
    renderReveal();
  }

  function handKey(c) { return c.hole.join('') + '|' + c.board.join(''); }

  // 错题本只存下这个 key，复盘时要把它还原成两张底牌加三张公共牌
  function cutCards(s) {
    var out = [];
    for (var i = 0; i + 1 < s.length; i += 2) out.push(s.slice(i, i + 2));
    return out;
  }
  function queueFromMistakes(list) {
    return list.map(function (m) {
      if (m.hole && m.board) return { id: m.id, hole: m.hole, board: m.board };
      var parts = String(m.key || '').split('|');
      return { id: m.id, hole: cutCards(parts[0] || ''), board: cutCards(parts[1] || '') };
    }).filter(function (q) { return q.hole.length === 2 && q.board.length === 3; });
  }

    });
    if (!a.breakdown.list.length) {
      body.appendChild(el('p', 'presetnote', '没有任何组合比你强'));

    // 二、胜率
    body.appendChild(el('div', 'lab', '你的胜率'));
    var tiles = el('div', 'tiles');
    [[a.ahead.toFixed(0) + '%', '现在领先', null],

    body.appendChild(tiles);

      a.board.structure + ' · ' + a.board.suit + '　你的牌：' + a.hand.cls));

    // 二之二、对手的续战范围

    // 三、分位
    body.appendChild(el('div', 'lab', '你在自己范围里'));
    var z = a.advice.zones;
    var bar = el('div', 'pctbar');
    if (sc.role === 'aggressor') {

    }
    body.appendChild(bar);
    var mk = el('div', 'mk');
    var tri = el('i');
    tri.style.left = a.pct + '%';
    mk.appendChild(tri);
    body.appendChild(mk);
    var zl = el('div', 'zlab');
    if (sc.role === 'aggressor') {
      zl.appendChild(el('span', null, '诈唬 0–' + z.bluffTo.toFixed(0)));
      zl.appendChild(el('span', null, '过牌 ' + z.bluffTo.toFixed(0) + '–' + z.valueFrom.toFixed(0)));
      zl.appendChild(el('span', null, '价值 ' + z.valueFrom.toFixed(0) + '–100'));
    } else {
      zl.appendChild(el('span', null, '弃牌 0–' + z.foldTo.toFixed(0)));
      zl.appendChild(el('span', null, '跟注 ' + z.foldTo.toFixed(0) + '–' + z.raiseFrom.toFixed(0)));
      zl.appendChild(el('span', null, '加注 ' + z.raiseFrom.toFixed(0) + '–100'));
    }
    body.appendChild(zl);
    // 分位说的是"排第几"，闸说的是"最后怎么打"，两者可能不一致，必须讲清楚
    var band = sc.role === 'aggressor'
      ? (a.pct >= z.valueFrom ? 'value' : a.pct <= z.bluffTo ? 'bluff' : 'check')
      : (a.pct <= z.foldTo ? 'fold' : a.pct >= z.raiseFrom ? 'raise' : 'call');
    var pl = el('p', 'zoneline');
    pl.innerHTML = '排在第 <b>' + a.pct.toFixed(0) + '%</b>，按分位落在' +
      '<b style="color:' + ZONE_COLOR[band] + '">' + ZONE_CN[band] + '</b>' +
      (band === a.advice.zone ? ''
        : '，但过闸之后按<b style="color:' + ZONE_COLOR[a.advice.zone] + '">' +
          ZONE_CN[a.advice.zone] + '</b>打');
    body.appendChild(pl);

    // 四、建议
    body.appendChild(el('div', 'lab', '建议'));
    sc.actions.forEach(function (k) {
      var w = a.advice.weights[k] || 0;
      var row = el('div', 'arow');
      row.appendChild(el('span', 'an', actionLabel(sc, k)));
      var trk = el('span', 'atrk');
      var fi = el('i');
      var col = sc.role === 'aggressor'
        ? (k === 'bet33' ? 'var(--btn-raise)' : k === 'bet75' ? 'var(--btn-fold)' : 'var(--btn-call)')
        : (k === 'fold' ? 'var(--fold)' : k === 'call' ? 'var(--btn-call)' : 'var(--btn-fold)');
      fi.style.cssText = 'width:' + w + '%;background:' + col;
      trk.appendChild(fi);
      row.appendChild(trk);
      var v = el('span', 'av', w + '%');
      if (w >= 50) v.style.fontWeight = '700'; else v.style.color = 'var(--muted)';
      row.appendChild(v);
      body.appendChild(row);
    });
    body.appendChild(el('div', 'reason', reasonText(sc, a)));

    sheet.appendChild(body);

    var foot = el('div', 'revfoot');
    var nx = el('button', 'cta', session.i + 1 >= session.total ? '看结算' : '下一手');
    nx.onclick = function () {
      session.i++;
      if (session.i >= session.total) finishSession();
      else nextHand();
    };
    foot.appendChild(nx);
    sheet.appendChild(foot);
    root.appendChild(sheet);
  }

  /* 三道闸的四个数字。分位只说"我在自己范围里排第几"，
   * 这一块说的是"对手会怎么继续"，价值闸与诈唬排队都靠它。 */
  function gateBlock(sc, a) {
    var d = a.detail;
    if (!d) return null;
    var wrap = el('div');
    wrap.appendChild(el('div', 'lab',
      sc.role === 'aggressor' ? '对手面对小注会怎么继续' : '对手面对你的加注会怎么继续'));
    var tiles = el('div', 'tiles');
    [[Math.round(d.contFrac) + '%', '他继续的比例',
      d.block > 0.5 ? 'var(--good)' : d.block < -0.5 ? 'var(--bad)' : null],
     [Math.round(d.calledAhead) + '%', '被跟后现在领先', null],
     [Math.round(d.calledEq) + '%', '被跟后打到河牌',
      d.calledEq >= 50 ? 'var(--good)' : 'var(--bad)']
    ].forEach(function (t) {
      var e = el('div', 'tile');
      var b = el('b', null, t[0]);
      if (t[2]) { b.style.color = t[2]; e.style.borderColor = t[2]; }
      e.appendChild(b);
      e.appendChild(el('span', null, t[1]));
      tiles.appendChild(e);
    });
    wrap.appendChild(tiles);
    var drop = d.calledAhead - d.calledEq;
    wrap.appendChild(el('p', 'presetnote',
      '有效出张 ' + d.outs + ' 张。' +
      (drop >= 8
        ? '被跟之后打到河牌要掉 ' + Math.round(drop) + ' 个点：跟你的那些牌后面还会反超你。'
        : drop <= -8
          ? '被跟之后打到河牌还能涨 ' + Math.round(-drop) + ' 个点：这手牌靠的是后面。'
          : '这手牌打到河牌胜率变化不大。')));
    var blockTxt = d.block > 0.5
      ? '你这两张牌挡住的续战牌比平均多 ' + d.block.toFixed(1) + ' 个点，他会多弃一些'
      : d.block < -0.5
        ? '你这两张牌挡住的续战牌比平均少 ' + Math.abs(d.block).toFixed(1) + ' 个点，他会多跟一些'
        : '你这两张牌对他的续战比例几乎没有影响';
    wrap.appendChild(el('p', 'presetnote', '阻断：' + blockTxt));
    return wrap;
  }

  function seg(parent, width, bg) {
    var i = el('i');
    i.style.cssText = 'width:' + width + '%;background:' + bg;
    parent.appendChild(i);
  }

  /* 一句话理由。分区给骨架，后续增减给补充，两者必须说同一件事，
   * 不能出现"下注取价值"后面接"这是靠摊牌价值的牌"这种自相矛盾。 */
  function reasonText(sc, a) {
    var d = Math.round(a.delta);
    var z = a.advice.zone;
    var det = a.detail, zs = a.advice.zones;

    /* 三道闸改写结论时，理由必须讲闸的事，不能再讲分位，
     * 否则会出现"排在顶部"后面接"所以过牌"这种自相矛盾。 */
    if (det) {
      var blockTail = det.block > 0.5
        ? '，而且你手里这两张牌挡掉了他一部分续战牌'
        : '';
      if (sc.role === 'aggressor' && z === 'check' && det.pct >= zs.valueFrom) {
        if (det.calledAhead >= 50) {
          return '这手牌现在确实领先，问题出在后面。' +
            '下注之后跟你的那部分范围，此刻你还领先 ' + Math.round(det.calledAhead) + '%，' +
            '但把转牌河牌发完只剩 ' + Math.round(det.calledEq) + '%：' +
            '你只有 ' + det.outs + ' 张出张，而跟下来的牌张张都可能反超你。' +
            '下注把最该弃的牌赶走，留下的正是要打败你的牌。过牌，保住这点摊牌价值。';
        }
        return '分位看着靠前，但真正要问的是：下注之后谁会跟。' +
          '跟你的那部分范围里你只有 ' + Math.round(det.calledEq) + '% 胜率，' +
          '比你差的牌都弃了、比你好的牌都跟了，这不是价值下注。过牌。';
      }
      if (sc.role === 'aggressor' && z === 'check' && det.pct <= zs.bluffTo) {
        return '你在范围底部，但诈唬名额有限，' +
          (det.score <= 0
            ? '而这手牌下注并不会提高你赢下底池的概率：对手只弃 ' +
              Math.round(det.foldFrac) + '%，你被跟之后也追不回来。'
            : '这一轮的名额已经给了出张更多、阻断更强的牌。') +
          '放弃它，把诈唬留给更值钱的组合。';
      }
      if (sc.role === 'aggressor' && z === 'bluff') {
        return '摊牌价值不够，但诈唬名额该给这样的牌：' +
          '有 ' + det.outs + ' 张出张能把你打成大牌，对手会弃掉 ' +
          Math.round(det.foldFrac) + '%' + blockTail + '。' +
          '被跟也还有 ' + Math.round(det.calledEq) + '% 的胜率，比过牌值钱。';
      }
      if (sc.role === 'aggressor' && z === 'value') {
        return '排在你范围前列，被跟之后打到河牌仍有 ' + Math.round(det.calledEq) + '% 胜率，' +
          '更差的牌会跟，跟下来你也赢得了。' +
          (d <= -12 ? '牌力靠的是现在而不是将来，用小注拿价值。' :
           d >= 8 ? '到河牌还能再涨 ' + d + ' 个点，敢用大注。' : '下注取价值。');
      }
      if (sc.role === 'defender' && z === 'raise' && !det.valueRaise) {
        return '这手牌没有摊牌价值，但适合当加注诈唬：' +
          '有 ' + det.outs + ' 张出张，对手面对加注会弃掉 ' +
          Math.round(det.foldFrac) + '%' + blockTail + '，比跟注或弃牌都值钱。';
      }
      if (sc.role === 'defender' && z === 'call' && det.pct >= zs.raiseFrom) {
        return '分位够加注，但他跟你的加注之后，你打到河牌只剩 ' + Math.round(det.calledEq) + '% 胜率。' +
          '加注只会赶走更差的牌、留下更好的牌，跟注更实在。';
      }
      if (sc.role === 'defender' && z === 'raise') {
        return '排在你防守范围的顶部，被跟之后打到河牌仍有 ' + Math.round(det.calledEq) + '% 胜率，' +
          '加注取价值，也把对手的听牌赶走。';
      }
    }

    if (z === 'value') {
      if (d <= -12) {
        return '这手牌现在领先 ' + a.ahead.toFixed(0) + '% 的组合，排在你范围前列，所以下注。' +
          '但它到河牌还会掉 ' + Math.abs(d) + ' 个点，牌力靠的是现在而不是将来，' +
          '所以用小注：既拿到价值，也不必在被加注时为难。';
      }
      if (d >= 8) {
        return '这手牌既排在你范围的顶部，又还能再涨 ' + d + ' 个点，' +
          '是可以用大注的牌，被跟被加都不怕。';
      }
      return '这手牌排在你范围的顶部，领先 ' + a.ahead.toFixed(0) + '% 的组合，下注取价值。';
    }

    if (z === 'bluff') {
      if (d >= 8) {
        return '你只赢 ' + a.ahead.toFixed(0) + '% 的组合，但这正是该下注的位置。' +
          '你在自己范围的底部，没有摊牌价值，而这手牌到河牌还能涨 ' + d + ' 个点，' +
          '诈唬被跟也还有后手。';
      }
      return '你只赢 ' + a.ahead.toFixed(0) + '% 的组合，也没有什么发展空间。' +
        '正因为毫无摊牌价值，它才适合拿来诈唬，好牌要留着过牌。';
    }

    if (z === 'check') {
      if (d <= -12) {
        return '这手牌不上不下：现在领先 ' + a.ahead.toFixed(0) + '% 的组合，' +
          '到河牌却要掉 ' + Math.abs(d) + ' 个点。下注只会被更好的跟、被更差的弃，' +
          '过牌把这点摊牌价值保住。';
      }
      if (d >= 8) {
        return '这手牌在范围中段，但还能涨 ' + d + ' 个点。' +
          '过牌可以免费看下一张，等真的成牌再收钱。';
      }
      return '这手牌在范围中段，下注会被更好的跟、被更差的弃，过牌保住摊牌价值。';
    }

    if (z === 'fold') {
      return '你只赢 ' + a.ahead.toFixed(0) + '% 的组合' +
        (d >= 8 ? '，虽然还有 ' + d + ' 个点的成长空间，但' : '，而且') +
        '赔率不够，这手牌排在你防守范围的最底部，弃掉。';
    }
    if (z === 'raise') {
      return '这手牌排在你范围的顶部，领先 ' + a.ahead.toFixed(0) + '% 的组合，' +
        '加注取价值，也把对手的听牌赶走。';
    }
    return '够格继续但不够格加注。你领先 ' + a.ahead.toFixed(0) + '% 的组合，' +
      '跟注保住摊牌价值，把加注留给更强的牌。';
  }

  function toggleRange(sc) {
    var root = document.getElementById('screen-train');
    var open = root.querySelector('.rangeover');
    if (open) { root.removeChild(open); return; }
    var over = el('div', 'rangeover');
    over.appendChild(el('div', 'lab', '对手范围　' + St.data.settings.preset));
    over.appendChild(rangeGrid(oppBuilt(sc), oppAction(sc)));
    over.appendChild(el('div', 'lab', '你的范围'));
    over.appendChild(rangeGrid(heroBuilt(sc), heroAction(sc)));
    var close = el('button', 'cta ghost', '关闭');
    close.onclick = function () { root.removeChild(over); };
    over.appendChild(close);
    root.appendChild(over);
  }

  function quitSession() {
    var done = function () { session = null; show('home'); };
    if (session && session.i > 0) {
      ask('退出会放弃本局成绩。已答的 ' + session.i + ' 手仍计入累计统计。', done);
    } else done();
  }

  /* ---------------- 结算 ---------------- */
  function ratingOf(p) {
    if (p >= 100) return 'Perfect';
    if (p >= 90) return 'Excellent';
    if (p >= 75) return 'Good';
    if (p >= 60) return 'Fair';
    return 'Needs Work';
  }

  function finishSession() {
    var right = session.answers.filter(function (x) { return x.correct; });
    var wrong = session.answers.filter(function (x) { return !x.correct; });
    var pct = session.answers.length ? right.length / session.answers.length * 100 : 0;

    setNav(session.title, { label: '✕', fn: function () { show('home'); } }, null);
    navLeft.className = 'icon-btn';

    var root = document.getElementById('screen-result');
    clear(root);

    var head = el('div', 'resulthead');
    head.appendChild(el('div', 'score', right.length + ' / ' + session.answers.length));
    head.appendChild(el('div', 'rating', ratingOf(pct)));
    var marg = session.answers.filter(function (x) { return x.marginal; }).length;
    if (marg) head.appendChild(el('div', 'submeta', '其中 ' + marg + ' 手贴着分区边界，两边都算对'));
    root.appendChild(head);

    var pad = el('div', 'rlist');
    var sc = session.sc;
    var again = el('button', 'cta', '再来一局');
    again.onclick = function () { startSession(sc, null, null); };
    pad.appendChild(again);

    if (wrong.length) {
      var redo = el('button', 'cta ghost', '立刻重练这 ' + wrong.length + ' 手错题');
      redo.onclick = function () {
        startSession(sc, wrong.map(function (x) {
          return { id: x.id, hole: x.hole, board: x.board };
        }), '错题复盘');
      };
      pad.appendChild(redo);
    }
    var close = el('button', 'cta ghost', '返回');
    close.onclick = function () { show('home'); };
    pad.appendChild(close);

    if (wrong.length) pad.appendChild(listBlock('✖ 打错的手牌', 'var(--bad)', wrong));
    if (right.length) pad.appendChild(listBlock('✔ 打对的手牌', 'var(--good)', right));
    root.appendChild(pad);

    session.done = true;
    show('result');
  }

  function listBlock(title, color, rows) {
    var wrap = el('div');
    var h = el('h3', null, title);
    h.style.color = color;
    wrap.appendChild(h);
    rows.forEach(function (x) {
      var sc = BY_ID[x.id];
      var r = el('div', 'rrow');
      var mini = el('div', 'mini');
      x.hole.forEach(function (c) { mini.appendChild(Table.cardNode(c, 'mcard')); });
      r.appendChild(mini);
      var bd = el('div', 'mini bd');
      x.board.forEach(function (c) { bd.appendChild(Table.cardNode(c, 'mcard sm')); });
      r.appendChild(bd);
      var info = el('div', 'rinfo');
      var top = el('div', 'rgto');
      var dot = el('div', 'dot');
      dot.style.background = ZONE_COLOR[x.a.advice.zone];
      top.appendChild(dot);
      top.appendChild(el('span', null, ZONE_CN[x.a.advice.zone] + ' · 分位 ' + x.a.pct.toFixed(0) + '%'));
      info.appendChild(top);
      info.appendChild(el('div', 'rmine', '你选了 ' + actionLabel(sc, x.chosen) +
        (x.marginal ? '（贴边）' : '')));
      r.appendChild(info);
      wrap.appendChild(r);
    });
    return wrap;
  }

  /* ---------------- 分析模式 ----------------
   * 不计分，不发牌。自己摆公共牌与底牌，改对手范围，结果立刻重算。 */
  var an = { scId: FLOP_SCENARIOS[0].id, board: [], hole: [] };

  function renderAnalysis() {
    var sc = BY_ID[an.scId];
    setNav('分析模式',
      { label: '✕', fn: function () { show('home'); } },
      { label: '随机', fn: function () { randomSpot(); } });
    navLeft.className = 'icon-btn';
    navRight.className = 'txt-btn';

    var root = document.getElementById('screen-analysis');
    clear(root);
    var w = el('div', 'sheetwrap');

    // 场景选择
    w.appendChild(el('div', 'lab', '场景'));
    var chips = el('div', 'chips');
    FLOP_SCENARIOS.forEach(function (s) {
      var c = el('button', 'chip' + (s.id === an.scId ? ' on' : ''),
        s.hero + (s.role === 'aggressor' ? ' 进攻' : ' 防守'));
      c.onclick = function () {
        an.scId = s.id; an.hole = []; clearCalc(); renderAnalysis();
      };
      chips.appendChild(c);
    });
    w.appendChild(chips);
    w.appendChild(el('p', 'presetnote', sc.line + '。底池 ' + sc.pot + 'BB。'));

    // 摆牌
    var box = el('div', 'anbox');
    var hd = el('div', 'anhd');
    hd.appendChild(el('div', 'lab', '公共牌'));
    hd.appendChild(el('em', null, an.board.length === 3
      ? Board.classify(an.board).structure + ' · ' + Board.classify(an.board).suit : '点空位选牌'));
    box.appendChild(hd);
    box.appendChild(slotRow(an.board, 3, 'board'));
    box.appendChild(el('div', 'lab', '你的底牌'));
    box.appendChild(slotRow(an.hole, 2, 'hole'));
    w.appendChild(box);

    // 结果区单独成块，编辑范围时只刷这一块
    var slot = el('div');
    slot.id = 'an-result';
    if (an.board.length === 3 && an.hole.length === 2) slot.appendChild(analysisResult(sc));
    else slot.appendChild(el('p', 'presetnote', '摆满三张公共牌和两张底牌后，这里会显示完整分解。'));
    w.appendChild(slot);

    // 范围编辑器
    var ref = sc.oppRange;
    var b = rangeFor(ref, St.data.settings.preset), act = actionFor(ref, St.data.settings.preset);
    var rp = rangePct(b, act);
    var ehd = el('div', 'anhd');
    ehd.appendChild(el('div', 'lab', '对手范围　点格子增减'));
    var meta = el('em', null, rp.pct.toFixed(1) + '% · ' + rp.combos + ' 组合');
    meta.id = 'an-rangemeta';
    ehd.appendChild(meta);
    w.appendChild(ehd);

    var pchips = el('div', 'chips');
    pchips.id = 'an-presets';
    renderPresetChips(pchips, ref);
    w.appendChild(pchips);

    w.appendChild(editableGrid(ref, b, act));
    var lg = el('div', 'anlegend');
    [['var(--btn-call)', '跟注 100%'], ['#1c6a4c', '部分频率 50%'], ['#33475c', '弃牌']].forEach(function (p) {
      var s = el('span');
      var i = el('i'); i.style.background = p[0];
      s.appendChild(i); s.appendChild(el('b', null, p[1]));
      s.lastChild.style.fontWeight = '400';
      lg.appendChild(s);
    });
    w.appendChild(lg);
    w.appendChild(el('p', 'editnote', '每点一下在弃牌、半频、跟注之间循环。改完上面的胜率与建议立刻重算。'));

    root.appendChild(w);
  }

  function renderPresetChips(host, ref) {
    clear(host);
    Object.keys(OPP_PRESETS).forEach(function (k) {
      var on = !hasCustom(ref) && St.data.settings.preset === k;
      var c = el('button', 'chip' + (on ? ' on' : ''), k);
      c.onclick = function () {
        delete St.data.custom[customKey(ref)];
        St.data.settings.preset = k; saveStore(); clearCalc(); renderAnalysis();
      };
      host.appendChild(c);
    });
    if (hasCustom(ref)) {
      var cc = el('button', 'chip on', '自定义 · 点此还原');
      cc.onclick = function () {
        delete St.data.custom[customKey(ref)];
        saveStore(); clearCalc(); renderAnalysis();
      };
      host.appendChild(cc);
    }
  }

  function slotRow(arr, n, which) {
    var row = el('div', 'slots');
    for (var i = 0; i < n; i++) {
      (function (idx) {
        var c = arr[idx];
        var s;
        if (c) {
          s = el('div', 'slot' + (Table.RED[c[1]] ? ' red' : ''));
          s.appendChild(el('div', 'r', c[0]));
          s.appendChild(el('div', 's', Table.SUITS[c[1]]));
        } else {
          s = el('div', 'slot empty', '+');
        }
        s.onclick = function () { openPicker(which, idx); };
        row.appendChild(s);
      })(i);
    }
    return row;
  }

  function usedCards() { return an.board.concat(an.hole); }

  function openPicker(which, idx) {
    var used = usedCards();
    var cur = (which === 'board' ? an.board : an.hole)[idx];
    var over = el('div', 'picker');
    var box = el('div', 'pickbox');
    box.appendChild(el('h4', null, which === 'board' ? '选一张公共牌' : '选一张底牌'));
    var grid = el('div', 'pickgrid');
    'shdc'.split('').forEach(function (su) {
      'AKQJT98765432'.split('').forEach(function (rk) {
        var card = rk + su;
        var taken = used.indexOf(card) >= 0 && card !== cur;
        var c = el('div', 'pcell' + (Table.RED[su] ? ' red' : '') + (taken ? ' used' : ''));
        c.appendChild(el('div', null, rk));
        c.appendChild(el('small', null, Table.SUITS[su]));
        if (!taken) c.onclick = function () {
          var arr = which === 'board' ? an.board : an.hole;
          arr[idx] = card;
          // 填补空洞，保持数组紧凑
          var compact = arr.filter(function (x) { return !!x; });
          if (which === 'board') an.board = compact; else an.hole = compact;
          document.body.removeChild(over);
          clearCalc();
          renderAnalysis();
        };
        grid.appendChild(c);
      });
    });
    box.appendChild(grid);
    var clr = el('button', 'cta ghost', cur ? '清空这一张' : '取消');
    clr.onclick = function () {
      if (cur) {
        var arr = which === 'board' ? an.board : an.hole;
        arr.splice(idx, 1);
        clearCalc();
      }
      document.body.removeChild(over);
      renderAnalysis();
    };
    box.appendChild(clr);
    over.appendChild(box);
    over.onclick = function (e) { if (e.target === over) document.body.removeChild(over); };
    document.body.appendChild(over);
  }

  function randomSpot() {
    var sc = BY_ID[an.scId];
    var d = dealHand(sc);
    an.hole = d.hole; an.board = d.board;
    clearCalc();
    renderAnalysis();
  }

  function analysisResult(sc) {
    var wrap = el('div');
    var a = analyse(sc, an.board, an.hole);
    var inRange = a.pct != null;

    var tiles = el('div', 'tiles');
    [[a.ahead.toFixed(0) + '%', '现在领先', null],
     [a.equity.toFixed(0) + '%', '算到河牌', null],
     [inRange ? a.pct.toFixed(0) + '%' : '—', '范围分位',
      inRange ? ZONE_COLOR[a.advice.zone] : null]].forEach(function (t) {
      var d = el('div', 'tile');
      var b = el('b', null, t[0]);
      if (t[2]) b.style.color = t[2];
      d.appendChild(b);
      d.appendChild(el('span', null, t[1]));
      tiles.appendChild(d);
    });
    wrap.appendChild(tiles);

    var meta = el('p', 'presetnote', '对手 ' + Math.round(a.breakdown.total) + ' 个组合　比你强 ' +
      a.breakdown.behind.toFixed(1) + '%　你的牌：' + a.hand.cls +
      '　后续 ' + (a.delta >= 0 ? '+' : '') + a.delta.toFixed(0));
    wrap.appendChild(meta);

    if (!inRange) {
      wrap.appendChild(el('p', 'editnote', '这手牌不在你这个场景的范围里，所以没有分位与建议。' +
        '换一手牌，或者在上面切到别的场景。'));
      return wrap;
    }

    var gb = gateBlock(sc, a);
    if (gb) wrap.appendChild(gb);

    wrap.appendChild(el('div', 'lab', '建议'));
    sc.actions.forEach(function (k) {
      var wt = a.advice.weights[k] || 0;
      var row = el('div', 'arow');
      row.appendChild(el('span', 'an', actionLabel(sc, k)));
      var trk = el('span', 'atrk');
      var fi = el('i');
      var col = sc.role === 'aggressor'
        ? (k === 'bet33' ? 'var(--btn-raise)' : k === 'bet75' ? 'var(--btn-fold)' : 'var(--btn-call)')
        : (k === 'fold' ? 'var(--fold)' : k === 'call' ? 'var(--btn-call)' : 'var(--btn-fold)');
      fi.style.cssText = 'width:' + wt + '%;background:' + col;
      trk.appendChild(fi);
      row.appendChild(trk);
      var v = el('span', 'av', wt + '%');
      if (wt >= 50) v.style.fontWeight = '700'; else v.style.color = 'var(--muted)';
      row.appendChild(v);
      wrap.appendChild(row);
    });
    wrap.appendChild(el('div', 'reason', reasonText(sc, a)));
    return wrap;
  }

  /* 可编辑的 13×13：每点一下在 0、50、100 之间循环。
   * 点击只改这一格的颜色，不整屏重绘。重算分位阶梯要 350 毫秒，
   * 连点十几下就会卡死，所以计算延后合并，停手 400 毫秒后只刷结果区。 */
  var editTimer = null;

  function editableGrid(ref, built, action) {
    var box = el('div', 'gridbox');
    var grid = el('div', 'grid');
    Range.ALL_HANDS.forEach(function (h) {
      var f = built.grid[h.key] ? built.grid[h.key][action] : 0;
      var cell = el('div', 'gcell edit', h.key);
      paintCell(cell, f);
      cell.onclick = function () {
        var key = customKey(ref);
        if (!St.data.custom[key]) St.data.custom[key] = snapshotRange(ref);
        var cur = St.data.custom[key][h.key] || 0;
        var next = cur === 0 ? 50 : cur < 100 ? 100 : 0;
        St.data.custom[key][h.key] = next;
        paintCell(cell, next);
        scheduleRecalc();
      };
      grid.appendChild(cell);
    });
    box.appendChild(grid);
    return box;
  }

  function paintCell(cell, f) {
    cell.classList.toggle('lit', f >= 50);
    cell.style.background = f === 0 ? '#33475c' : f >= 100 ? 'var(--btn-call)' : '#1c6a4c';
  }

  function scheduleRecalc() {
    var meta = document.getElementById('an-rangemeta');
    if (meta) meta.textContent = '改动中…';
    if (editTimer) clearTimeout(editTimer);
    editTimer = setTimeout(function () {
      editTimer = null;
      saveStore();
      clearCalc();
      refreshAnalysis();
    }, 400);
  }

  // 只重算结果区与范围占比，不动网格，避免编辑时焦点乱跳
  function refreshAnalysis() {
    var sc = BY_ID[an.scId];
    var meta = document.getElementById('an-rangemeta');
    if (meta) {
      var ref = sc.oppRange;
      var rp = rangePct(rangeFor(ref, St.data.settings.preset), actionFor(ref, St.data.settings.preset));
      meta.textContent = rp.pct.toFixed(1) + '% · ' + rp.combos + ' 组合';
    }
    var slot = document.getElementById('an-result');
    if (!slot) return;
    clear(slot);
    if (an.board.length === 3 && an.hole.length === 2) slot.appendChild(analysisResult(sc));
    else slot.appendChild(el('p', 'presetnote', '摆满三张公共牌和两张底牌后，这里会显示完整分解。'));
    // 自定义标记可能刚出现，预设那一行要跟着变
    var pc = document.getElementById('an-presets');
    if (pc) renderPresetChips(pc, sc.oppRange);
  }

  /* ---------------- 设置 ---------------- */
  function renderSettings() {
    setNav('设置', { label: '‹', fn: function () { show('home'); } }, null);
    navLeft.className = 'icon-btn';
    navLeft.style.fontSize = '28px';

    var root = document.getElementById('screen-settings');
    clear(root);
    var pad = el('div', 'pad');

    pad.appendChild(seg2('每局手数', '一局练多少手', [10, 20, 50], St.data.settings.hands,
      function (v) { St.data.settings.hands = v; saveStore(); renderSettings(); }));

    pad.appendChild(seg2('价值区宽度', '进攻方顶部多少比例走价值下注。这是整套模型唯一的方向盘',
      [40, 50, 60], St.data.settings.valueWidth,
      function (v) { St.data.settings.valueWidth = v; saveStore(); renderSettings(); }));

    pad.appendChild(seg2('加注区宽度', '防守方顶部多少比例走加注',
      [12, 18, 25], St.data.settings.raiseWidth,
      function (v) { St.data.settings.raiseWidth = v; saveStore(); renderSettings(); }));

    pad.appendChild(seg2('对手类型', '默认 GTO。改了之后所有胜率与建议都会重算',
      Object.keys(OPP_PRESETS), St.data.settings.preset,
      function (v) { St.data.settings.preset = v; saveStore(); clearCalc(); renderSettings(); }));

    var wipe = el('button', 'cta ghost', '清空全部统计');
    wipe.style.marginTop = '26px';
    wipe.onclick = function () {
      ask('清空全部训练统计与错题记录，无法恢复。', function () {
        St.reset(); show('home');
      });
    };
    pad.appendChild(wipe);

    var t = aggregate(FLOP_SCENARIOS.map(function (s) { return s.id; }));
    var sum = el('p', null, '累计 ' + t.hands + ' 手　正确 ' + t.correct + '　错误 ' + t.wrong +
      (t.hands ? '　正确率 ' + (t.correct / t.hands * 100).toFixed(1) + '%' : ''));
    sum.style.cssText = 'color:var(--muted);font-size:13.5px;text-align:center;margin-top:14px';
    pad.appendChild(sum);
    root.appendChild(pad);
  }

  function seg2(label, hint, opts, cur, onPick) {
    var row = el('div', 'row');
    var left = el('div');
    left.appendChild(el('div', 'labx', label));
    left.appendChild(el('div', 'hint', hint));
    row.appendChild(left);
    var s = el('div', 'seg');
    opts.forEach(function (o) {
      var b = el('button', o === cur ? 'on' : '', String(o));
      b.onclick = function () { onPick(o); };
      s.appendChild(b);
    });
    row.appendChild(s);
    return row;
  }

  /* ---------------- 说明 ---------------- */
  function renderHelp() {
    setNav('说明', { label: '‹', fn: function () { show('home'); } }, null);
    navLeft.className = 'icon-btn';
    navLeft.style.fontSize = '28px';
    var root = document.getElementById('screen-help');
    clear(root);
    var pad = el('div', 'pad help');
    [['这是什么', '翻牌圈的决策训练器。八个场景，覆盖单加注池与 3bet 池，进攻方与防守方两个视角。对手范围来自翻前训练器那份数据。'],
     ['它不是 GTO', '界面上不会出现 GTO 三个字，这是故意的。翻牌的节点数是千万级，只有 solver 能解。这里展示的胜率、组合分解、范围分位全部是精确计算，但把它们变成动作建议靠的是两个明说的常数，不是解出来的均衡。'],
     ['四个数字怎么看', '现在领先是你此刻战胜对手多少组合；算到河牌是把转牌河牌发完的胜率；后续增减是两者之差，正数说明你是听牌，负数说明你靠摊牌价值；范围分位是你这手牌在自己整条范围里的排名。'],
     ['为什么分位比胜率重要', '胜率相近的两手牌打法可能完全相反。中等牌力胜率不低但该过牌，因为下注只会被更好的跟、更差的弃；范围底部的牌胜率很低却该下注，因为它唯一的赢法就是让对手弃牌。分位决定你在极化结构里的位置。'],
     ['「对手会怎么继续」那一块', '分位只说你排第几，这一块说对手会怎么应对，建议最后由它定。他继续的比例来自最小防守频率，再按你手里这两张牌挡掉了他多少续战组合修正，这就是阻断。被跟后你领先说的是：真被跟了，他那部分范围里你还打得过多少——不到一半就不是价值下注，哪怕分位很高也改过牌。有效出张数的是一张转牌能把你打成三条及以上的张数，后门听牌记零张。'],
     ['分位在价值区却让我过牌', '因为更差的牌不会跟。A 高在 K 高干燥面上分位常常很靠前，但你一下注，比你差的全弃、比你好的全跟，价值无从谈起。同理，有些牌小注能拿到价值、大注拿不到，建议里就只留小注。'],
     ['为什么我在范围底部却不让我诈唬', '诈唬名额是由赔率定死的，名额有限。名额给的是下注最能提高胜率的那些牌：出张多、挡住对手续战牌多的排在前面。轮不上的那些就放弃，这比每手底牌都打出去更值钱。'],
     ['贴边是什么意思', '分区边界是人定的常数，不该因为差一个百分点就把人判错。距离边界 5 个百分点以内时，相邻区的动作也算对。'],
     ['想调松紧', '设置里可以换对手类型。注意松不等于弱：一个什么 K 都跟的人，在 K 高面上的顶对比 GTO 玩家还多。'],
     ['数据存在哪', '全部存在这台手机的浏览器里，不上传，不需要注册。']
    ].forEach(function (b) {
      pad.appendChild(el('h3', null, b[0]));
      pad.appendChild(el('p', null, b[1]));
    });
    root.appendChild(pad);
  }

  /* ---------------- 启动 ---------------- */
  Table.watch(function () { return document.querySelector('#screen-train .felt'); });
  show('home');
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
